<!DOCTYPE html>
<html lang="id" class="bg-gray-100">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FokusMasaDepan</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { inter: ["Inter", "sans-serif"] },
                    colors: {
                        primary: { DEFAULT: "#2563eb", light: "#3b82f6", dark: "#1e40af" },
                        accent: "#10b981",
                        soft: "#f1f5f9"
                    }
                }
            }
        }
    </script>
</head>
<body class="font-inter">
    <div id="app-container" class="max-w-md mx-auto bg-white min-h-screen shadow-xl rounded-xl overflow-hidden border border-gray-200">

        <header class="p-4 flex justify-between items-center bg-white shadow-md sticky top-0 z-10">
            <h1 class="text-xl font-bold text-primary">FokusMasaDepan</h1>
            <button onclick="showModal('modal-edit-settings')" class="text-gray-600 hover:text-primary transition-colors">
                <i class="fas fa-gear text-xl"></i>
            </button>
        </header>

        <div id="page-beranda" class="page active pb-24">
            <section class="p-5 bg-primary text-white rounded-b-3xl shadow-lg">
                <p class="text-sm opacity-80">Saldo Saat Ini</p>
                <p id="current-saldo" class="text-5xl font-bold">0</p>
            </section>

            <section class="p-4 -mt-4">
                <div class="bg-soft p-4 rounded-xl shadow-inner border border-gray-200">
                    <div class="flex justify-between items-center mb-2">
                        <p class="font-semibold text-gray-700">Limit Bulanan (Rp<span id="limit-amount-display">0</span>)</p>
                        <span id="limit-bulanan-status" class="font-bold text-primary">Aman</span>
                    </div>
                    <p id="motivasi-text" class="text-sm italic text-gray-600">Atur Limit Bulanan Anda di Pengaturan!</p>
                </div>
            </section>

            <section class="p-4 pt-0">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-bold text-gray-800">Ringkasan <span id="summary-period">Bulan Ini</span></h2>

                    <select id="filter-select" class="p-2 border rounded-lg text-sm bg-white shadow-sm">
                        <option value="today">Hari Ini</option>
                        <option value="week">Minggu Ini</option>
                        <option value="month" selected>Bulan Ini</option>
                        <option value="year">Tahun Ini</option>
                        <option value="all">Semua</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3 bg-soft p-4 rounded-xl border border-gray-200 shadow-sm">
                    <div class="text-center">
                        <p class="text-sm text-gray-500">Pemasukan</p>
                        <p id="summary-income" class="text-xl font-bold text-accent">0</p>
                    </div>
                    <div class="text-center">
                        <p class="text-sm text-gray-500">Pengeluaran</p>
                        <p id="summary-expense" class="text-xl font-bold text-red-500">0</p>
                    </div>
                </div>
            </section>

            <section class="p-4 pt-0">
                <h2 class="text-lg font-bold text-gray-800 mb-3">Riwayat Transaksi</h2>
                <ul id="transaction-list" class="divide-y divide-gray-200"></ul>
            </section>

            <button onclick="showModal('modal-tambah-transaksi')" class="fixed bottom-24 right-6 bg-accent text-white p-4 rounded-full shadow-xl hover:scale-110 transition-transform">
                <i class="fas fa-plus text-xl"></i>
            </button>
        </div>

        <div id="page-impian" class="page pb-24"></div>
        <div id="page-analisis" class="page pb-24"></div>

        <div id="modal-tambah-transaksi" class="modal-overlay"></div>
        <div id="modal-edit-dream" class="modal-overlay"></div>
        <div id="modal-edit-settings" class="modal-overlay"></div>
        <div id="modal-confirm-reset" class="modal-overlay"></div>

        <div id="toast">Pesan notifikasi...</div>
    </div>

    <script src="script.js"></script>
</body>
            </html>
